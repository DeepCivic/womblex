# Judgment reference set: decisions (type=decision) whose TEXT references any
# of the curated instruments (emergency_planning_set.yaml). Consumed by
# run_tier.py --reference-file. Already-ingested docs are excluded automatically
# (the derived manifest). Case-insensitive regex, matched against full text.
name: instrument_references

patterns:
  # Emergency / disaster
  - "State Emergency and Rescue Management Act 1989"
  - "Rural Fires Act 1997"
  - "State Emergency Service Act 1989"
  - "Reconstruction Authority Act 2022"
  - "National Emergency Declaration Act 2020"
  - "Water Management Act 2000"
  - "Public Health Act 2010"
  # Planning & environment
  - "Environmental Planning and Assessment Act 1979"
  - 'State Environmental Planning Policy \(Resilience and Hazards\)'
  - 'State Environmental Planning Policy \(Exempt and Complying Development\)'
  - "Local Environmental Plan"
  - "Environment Protection and Biodiversity Conservation Act 1999"
  # Financial
  - "Australian Prudential Regulation Authority Act 1998"
