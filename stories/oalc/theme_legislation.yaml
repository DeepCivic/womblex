# Themed governing legislation — land title / native title / national parks
# (step 0.1 top-up). The statutes the landtitle product's judgements interpret,
# enriched + AI-chunked + embedded into the corpus asset so 0.2 (the citing-
# judgement sweep) and the product can key off them.
#
# Consumed by run_tier.py --select-file. Each rule is a case-insensitive regex
# on the OALC `citation`, a `jurisdiction` constraint, and a `theme` tag. The
# theme is carried into a `theme` provenance column (manifest.parquet) so
# downstream can select statutes by theme. Decisions are always excluded
# (legislation + statutory instruments only); a doc matching several rules is
# selected once (deduped on version_id). Rules are anchored (^) to the exact
# Act citation so amendment Bills / subordinate instruments of the same name
# are not swept in — except WA Transfer of Land, where the live Act + its
# Licensed Surveyors Regulations are both wanted (2 docs).
#
# Presence confirmed against the full corpus.jsonl 2026-07-05 (exact-citation
# match on legislation-type docs): 15 docs, ~1.17 M tokens. See RUNLOG step 0.1.
name: theme_legislation

rules:
  # --- Land title ---
  - {citation: '^real property act 1900 \(nsw\)', jurisdiction: new_south_wales, theme: land_title}
  - {citation: '^land title act 1994 \(qld\)', jurisdiction: queensland, theme: land_title}
  - {citation: '^real property act 1886 \(sa\)', jurisdiction: south_australia, theme: land_title}
  - {citation: 'transfer of land act 1893', jurisdiction: western_australia, theme: land_title}   # WA Act + Licensed Surveyors Regs (2 docs)

  # --- National parks ---
  - {citation: '^national parks and wildlife act 1974 \(nsw\)', jurisdiction: new_south_wales, theme: national_parks}
  - {citation: '^national parks and wildlife act 1972 \(sa\)', jurisdiction: south_australia, theme: national_parks}
  - {citation: '^conservation and land management act 1984 \(wa\)', jurisdiction: western_australia, theme: national_parks}
  - {citation: '^nature conservation act 1992', jurisdiction: queensland, theme: national_parks}   # 'Nature Conservation Act 1992 — partly uncommenced (Qld)'
  # Cth EPBC Act 1999 (+ ~89 subordinate instruments) is theme national_parks but is
  # ALREADY in the asset (batch-0003, emergency_planning_set). It is deliberately NOT
  # re-selected: --select-file ingest does not exclude already-ingested docs, so re-adding
  # would duplicate source_hashes and re-spend (~$42). Its theme mapping is recorded in
  # RUNLOG step 0.1; its provenance predates the `theme` column (empty there).

  # --- Native title ---
  - {citation: '^native title act 1993 \(cth\)', jurisdiction: commonwealth, theme: native_title}   # principal Act only (amendment Acts are step 6 breadth)
  - {citation: '^native title \(new south wales\) act 1994 \(nsw\)', jurisdiction: new_south_wales, theme: native_title}
  - {citation: '^native title \(queensland\) act 1993 \(qld\)', jurisdiction: queensland, theme: native_title}
  - {citation: '^native title \(south australia\) act 1994 \(sa\)', jurisdiction: south_australia, theme: native_title}
  - {citation: '^native title \(tasmania\) act 1994 \(tas\)', jurisdiction: tasmania, theme: native_title}
  - {citation: '^aboriginal land rights \(northern territory\) act 1976 \(cth\)', jurisdiction: commonwealth, theme: native_title}   # NT land rights, a Cth Act
