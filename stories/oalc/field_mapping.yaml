# OALC record → element-shard field mapping (Open Australian Legal Corpus).
#
# Consumed by stories/oalc/run_tier.py, which builds a
# womblex.ingest.records.RecordFieldMapping from these keys. Corpus-specific
# invocation config only — no pipeline logic lives here (that is the library's
# ingest_records). See docs/landtitle-enrichment-design.md (step 0).
#
# corpus.jsonl fields (OALC v7.1.0): version_id, type, jurisdiction, source,
# mime, date, citation, url, when_scraped, text.

id_field: version_id      # stable per-record id → manifest doc_id + source_hash input
text_field: text          # already-clean judgment/legislation body

# Record metadata carried into *.provenance.parquet and the run-root
# manifest.parquet (source_hash → these columns). Everything except id_field
# and text_field, so no upstream signal is dropped.
provenance_fields:
  - type
  - jurisdiction
  - source
  - mime
  - date
  - citation
  - url
  - when_scraped

collection_id: oalc-v7.1.0
