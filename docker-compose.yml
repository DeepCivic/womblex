# Local distributed-run stack: Postgres (job queue) + MinIO (object store) +
# scalable Womblex workers. Mirrors the Wayfinder quickstart shape so the two
# projects can share infra.
#
#   docker compose up -d postgres minio createbuckets init
#   # upload source docs to the 'womblex' bucket under inputs/<dataset>/, then:
#   docker compose run --rm womblex enqueue --input-prefix inputs/demo \
#       --config configs/example.yaml --create-schema
#   docker compose up --scale worker=4 worker
#   # once drained, consolidate the run manifest:
#   docker compose run --rm womblex finalize --run-id <run_id>
#   # optional read-only console over the same bucket, at :8080:
#   docker compose up -d ui
#
# Inputs and outputs share the s3://womblex bucket; shards land at
# runs/<run_id>/documents/.

x-cloud-env: &cloud-env
  WOMBLEX_DB_DSN: postgresql://womblex:womblex@postgres:5432/womblex
  WOMBLEX_STORE_URI: s3://womblex
  WOMBLEX_S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: us-east-1
  ISAACUS_API_KEY: ${ISAACUS_API_KEY:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: womblex
      POSTGRES_PASSWORD: womblex
      POSTGRES_DB: womblex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U womblex"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket the pipeline reads/writes.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/womblex
      "

  # One-shot: create the womblex_jobs table.
  init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment: *cloud-env
    command: ["jobs", "--create-schema"]

  # General-purpose CLI entry (enqueue, run, manifest, ...). Use with `run`.
  womblex:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *cloud-env
    volumes:
      - ./configs:/app/configs
    profiles: ["cli"]

  # Scale horizontally: docker compose up --scale worker=4 worker
  worker:
    build: .
    depends_on:
      init:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment: *cloud-env
    volumes:
      - ./configs:/app/configs
    command: ["worker", "--config", "configs/example.yaml",
              "--poll-interval", "5", "--stale-timeout", "900"]

  # Optional read-only console (`womblex ui`, docs/ui-plan.md), at :8080.
  # Reads the same s3://womblex bucket the workers publish to — the shared
  # cloud-env anchor supplies WOMBLEX_STORE_URI, which is the run source the
  # CLI resolves when neither --output-root nor --store is passed.
  #
  # read_only: true is the container-level statement of the plan's rule that
  # no screen writes to a stage output; /tmp is tmpfs because a store-backed
  # read stages the manifest through a temp dir (ui/readers.py). Verified the
  # console needs no other writable path, HOME included.
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    environment: *cloud-env
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  miniodata:
