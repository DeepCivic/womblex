# Local distributed-run stack: Postgres (job queue) + MinIO (object store) +
# scalable Womblex workers. Mirrors the Wayfinder quickstart shape so the two
# projects can share infra.
#
#   docker compose up -d postgres minio createbuckets init
#   # upload source docs to the 'womblex' bucket under inputs/<dataset>/, then:
#   docker compose run --rm womblex enqueue --input-prefix inputs/demo \
#       --config configs/example.yaml --create-schema
#   docker compose up --scale worker=4 worker
#   # once drained, consolidate the run manifest:
#   docker compose run --rm womblex finalize --run-id <run_id>
#   # optional read-only console over the same bucket, at :8080:
#   docker compose up -d ui
#
#   # Just want to see the console with a sample corpus (no workers)?
#   # Bring up the infra, seed the vendored demo run into the bucket, then the
#   # console. Postgres is included so the Dashboard/Execution panels see a
#   # reachable queue (an empty one) rather than "queue unreachable":
#   docker compose up -d postgres minio createbuckets init
#   docker compose --profile seed up seed-demo
#   docker compose up -d ui           # run-throsby-demo now shows at :8080
#
# Inputs and outputs share the s3://womblex bucket; shards land at
# runs/<run_id>/documents/.
#
# Two images, one stack: the pipeline/worker services build the plain
# `Dockerfile`; the `ui` console builds `Dockerfile.ui` (adds a Node stage
# for the SPA). Both are named explicitly below so the split is legible.

x-cloud-env: &cloud-env
  WOMBLEX_DB_DSN: postgresql://womblex:womblex@postgres:5432/womblex
  WOMBLEX_STORE_URI: s3://womblex
  WOMBLEX_S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: us-east-1
  ISAACUS_API_KEY: ${ISAACUS_API_KEY:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: womblex
      POSTGRES_PASSWORD: womblex
      POSTGRES_DB: womblex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U womblex"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket the pipeline reads/writes.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/womblex
      "

  # One-shot: create the womblex_jobs table.
  init:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: *cloud-env
    command: ["jobs", "--create-schema"]

  # General-purpose CLI entry (enqueue, run, manifest, ...). Use with `run`.
  womblex:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *cloud-env
    volumes:
      - ./configs:/app/configs
    profiles: ["cli"]

  # Scale horizontally: docker compose up --scale worker=4 worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment: *cloud-env
    volumes:
      - ./configs:/app/configs
    command: ["worker", "--config", "configs/example.yaml",
              "--poll-interval", "5", "--stale-timeout", "900"]

  # One-shot, opt-in: publish the vendored sample corpus (run-throsby-demo)
  # into the bucket so a fresh console shows a browsable run instead of
  # "Sample corpus not present". Behind a profile so a real deployment does
  # not seed a sample into its own store unasked; run it explicitly with
  # `docker compose --profile seed up seed-demo`.
  seed-demo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    environment: *cloud-env
    command: ["seed-demo"]   # resolves WOMBLEX_STORE_URI -> s3://womblex
    profiles: ["seed"]

  # Optional read-only console (`womblex ui`, docs/ui-plan.md), at :8080.
  # Reads the same s3://womblex bucket the workers publish to — the shared
  # cloud-env anchor supplies WOMBLEX_STORE_URI, which is the run source the
  # CLI resolves when neither --output-root nor --store is passed.
  #
  # Depends on postgres AND minio being *healthy*, not just createbuckets: the
  # console advertises WOMBLEX_DB_DSN (the queue the Dashboard and Execution
  # panels read) and WOMBLEX_STORE_URI, so bringing it up before either is
  # ready is what produced the reported "queue unreachable" / intermittent
  # Composer 500s + failed-to-fetch — every screen's first reads raced the
  # backends' startup. Gating on health makes the console come up only once
  # both are answering.
  #
  # read_only: true is the container-level statement of the plan's rule that
  # no screen writes to a stage output; /tmp is tmpfs because a store-backed
  # read stages the manifest through a temp dir (ui/readers.py). Verified the
  # console needs no other writable path, HOME included.
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment: *cloud-env
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  miniodata:
