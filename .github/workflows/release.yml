name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (no API token needed).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp the commit into the package
        # Written before the build so the wheel carries it. A checkout resolves
        # its commit from the work tree; an installed wheel has none, so this
        # is the only moment the fact can be captured.
        run: |
          printf 'COMMIT = "%s"\n' "${GITHUB_SHA}" > src/womblex/_build_stamp.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distributions
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
