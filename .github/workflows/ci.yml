name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The job queue's tests need a real Postgres; without one they skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: womblex
          POSTGRES_DB: womblex
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        # setup-uv publishes no floating major tag from v8 on (`@v10` does not
        # resolve), so the release is named in full.
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: The lock matches pyproject.toml
        # A pyproject.toml edit that was not re-locked fails here, before
        # anything installs.
        run: uv lock --check

      - name: Install from the lock
        # The locked set, not a fresh resolve of pyproject.toml's ranges: a new
        # upstream release reaches CI only through a lock change on a PR
        # (docs/security-upgrade-plan.md, M0). The isaacus SDK is core, so the
        # enrich/graph/query/embed suites' `importorskip("isaacus")` never skips
        # wholesale; tests that need a live endpoint still skip on the missing
        # ISAACUS_API_KEY. [api] brings python-multipart: `create_api_app`
        # registers the multipart `POST /v1/uploads` route.
        run: uv sync --frozen --extra dev --extra api

      - name: Lint (ruff)
        run: uv run --no-sync ruff check src/ tests/

      - name: Type-check (mypy)
        run: uv run --no-sync mypy src/

      - name: Tests
        # Every file input is the synthetic set in fixtures/synthetic/. The
        # `benchmark` tests score against datasets this repository does not
        # carry; maintainers run them locally. Tests that call a paid API
        # (Isaacus, Bedrock) skip without credentials, which CI does not have.
        env:
          WOMBLEX_DB_DSN: postgresql://postgres:womblex@localhost:5432/womblex
        run: uv run --no-sync python -m pytest tests/ -v -m "not benchmark"

  docs:
    name: API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Build (strict)
        # mkdocstrings reads src/ statically, so only the docs group installs.
        # Strict: a broken reference or a docstring that fails to parse fails
        # the job.
        run: |
          uv sync --frozen --only-group docs
          uv run --no-sync mkdocs build --strict

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    # Known advisories in the locked Python set, so a new one shows on the PR
    # that would ship it (docs/security-upgrade-plan.md,
    # M1). Reported, not yet gating: the advisories open today are cleared by
    # the plan's upgrade merges (M2 to M5), and this line goes when they land.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Python (pip-audit over the lock)
        # Every extra, dev included, read from the hashed export with no
        # resolve. pip-audit runs pinned through uvx, so it is not a project
        # dependency.
        run: |
          uv export --frozen --all-extras --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  images:
    name: Container image (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The image carries the whole vision/ML stack on top of a 100 MB models/
    # directory.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pipeline
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        # The preinstalled toolchains are what the build would otherwise run
        # out of room behind; torch and opencv need the space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: womblex-${{ matrix.name }}:ci
          # The instructions a deployment builds, with nothing overridden but
          # the provenance compose does not supply: no CI-only variant, and
          # each Dockerfile's own EXTRAS default is what compose gets too.
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            REQUIRE_STAMP=1
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }}

      - name: The image names its commit
        # Both halves of it: the label a registry can read without running the
        # image, and the stamp the running package resolves.
        run: |
          image=womblex-${{ matrix.name }}:ci
          label=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
          stamp=$(docker run --rm --entrypoint python "$image" -c \
            'from womblex.store.build_info import build_info; print(build_info().commit_value)')
          echo "label=$label stamp=$stamp expected=$GITHUB_SHA"
          test "$label" = "$GITHUB_SHA"
          test "$stamp" = "$GITHUB_SHA"

      - name: An unstamped published build fails
        if: matrix.name == 'pipeline'
        # The asymmetry is the requirement: a published image that cannot name
        # its commit must not build at all. Cheap here — the builder still holds
        # the layers the build above produced, so this reaches the stamp in
        # seconds. No output is asked for; the exit status is the whole test.
        run: |
          if docker buildx build --build-arg REQUIRE_STAMP=1 \
              -f Dockerfile . > "$RUNNER_TEMP/unstamped.log" 2>&1; then
            echo "build should have failed with no SOURCE_COMMIT" >&2
            exit 1
          fi
          # It must fail for the stated reason: any build failure passing this
          # test would make a broken build look like the guard working.
          grep -q "SOURCE_COMMIT is required" "$RUNNER_TEMP/unstamped.log" || {
            echo "build failed, but not on the stamp guard:" >&2
            cat "$RUNNER_TEMP/unstamped.log" >&2
            exit 1
          }

      - name: The CLI runs
        if: matrix.name == 'pipeline'
        # `--help` proves the entry point; the import proves the system
        # libraries the image installs for OpenCV, which a missing
        # apt package breaks at load rather than at build.
        run: |
          docker run --rm womblex-pipeline:ci --help
          docker run --rm --entrypoint python womblex-pipeline:ci -c \
            'import womblex.ingest.extract, womblex.ingest.heuristics_cv2, womblex.cloud.worker'
