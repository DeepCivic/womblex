name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cloud]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Fast tests
        run: python -m pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Dependency audit (pip-audit)
        # Informational: the ML dependency tree (torch, ultralytics, …) carries
        # frequent upstream advisories we can't action directly, so surface them
        # without blocking CI — matches the "warn, don't reject" policy.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Static analysis (semgrep)
        # Blocking: SAST over our own source with the Python + OWASP rulesets.
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/owasp-top-ten --error src/
