name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev extras
        # The isaacus SDK is a core dependency now (no [isaacus] extra to ask
        # for), so it's always installed and the enrich/graph/query/embed
        # suites' `importorskip("isaacus")` never skips wholesale. The tests
        # that need a live endpoint still skip on the missing ISAACUS_API_KEY.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cloud,ui]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Fast tests
        run: python -m pytest tests/ -v

  frontend:
    name: Console frontend (ui/)
    runs-on: ubuntu-latest
    # Separate from `test`'s Python matrix — a broken SvelteKit build must
    # fail its own job, not hide inside (or block on) a pipeline test run it
    # has nothing to do with.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint (eslint)
        working-directory: ui
        run: npm run lint

      - name: Type-check (svelte-check)
        working-directory: ui
        run: npm run check

      - name: Build (vite)
        working-directory: ui
        run: npm run build

  images:
    name: Container image (${{ matrix.name }})
    runs-on: ubuntu-latest
    # One runner per image rather than two builds in one job: each carries the
    # whole vision/ML stack on top of a 100 MB models/ directory, and a single
    # runner's disk does not comfortably hold both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pipeline
            dockerfile: Dockerfile
          - name: console
            dockerfile: Dockerfile.ui
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # The preinstalled toolchains are what the build would otherwise run
        # out of room behind; torch, ultralytics and opencv need the space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: womblex-${{ matrix.name }}:ci
          # The instructions a deployment builds, with nothing overridden but
          # the provenance compose does not supply: no CI-only variant, and
          # each Dockerfile's own EXTRAS default is what compose gets too.
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            REQUIRE_STAMP=1
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }}

      - name: The image names its commit
        # Both halves of it: the label a registry can read without running the
        # image, and the stamp the running package resolves. The stamp is read
        # off a marker rather than taken as the whole of stdout: importing
        # `store` reaches PyMuPDF, which prints its `fitz` deprecation notice
        # there, and any such preamble would otherwise land in the value.
        run: |
          image=womblex-${{ matrix.name }}:ci
          label=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
          stamp=$(docker run --rm --entrypoint python "$image" -c \
            'from womblex.store.build_info import build_info; print("stamp:" + build_info().commit_value)' \
            | sed -n 's/^stamp://p')
          echo "label=$label stamp=$stamp expected=$GITHUB_SHA"
          test "$label" = "$GITHUB_SHA"
          test "$stamp" = "$GITHUB_SHA"

      - name: An unstamped published build fails
        if: matrix.name == 'pipeline'
        # The asymmetry is the requirement: a published image that cannot name
        # its commit must not build at all. Cheap here — the builder still holds
        # the layers the build above produced, so this reaches the stamp in
        # seconds. No output is asked for; the exit status is the whole test.
        run: |
          if docker buildx build --build-arg REQUIRE_STAMP=1 \
              -f Dockerfile . > "$RUNNER_TEMP/unstamped.log" 2>&1; then
            echo "build should have failed with no SOURCE_COMMIT" >&2
            exit 1
          fi
          # It must fail for the stated reason: any build failure passing this
          # test would make a broken build look like the guard working.
          grep -q "SOURCE_COMMIT is required" "$RUNNER_TEMP/unstamped.log" || {
            echo "build failed, but not on the stamp guard:" >&2
            cat "$RUNNER_TEMP/unstamped.log" >&2
            exit 1
          }

      - name: The CLI runs
        if: matrix.name == 'pipeline'
        # `--help` proves the entry point; the import proves the system
        # libraries the image installs for PyMuPDF and OpenCV, which a missing
        # apt package breaks at load rather than at build.
        run: |
          docker run --rm womblex-pipeline:ci --help
          docker run --rm --entrypoint python womblex-pipeline:ci -c \
            'import womblex.ingest.extract, womblex.ingest.heuristics_cv2, womblex.cloud.worker'

      - name: The console serves
        if: matrix.name == 'console'
        # A run source is required (the console reads exactly one), so point it
        # at the vendored demo corpus the image already carries — which also
        # makes this more than a liveness check: the run listing proves the
        # image can read a real run's artefacts, not just answer a health stub.
        run: |
          docker run -d --name console -p 8080:8080 \
            -e WOMBLEX_UI_OUTPUT_ROOT=/app/output/console-demo womblex-console:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then served=1; break; fi
            sleep 2
          done
          docker logs console
          test "${served:-0}" = "1"
          curl -fsS http://localhost:8080/api/runs | grep -q run-throsby-demo

  stack:
    name: Bundled stack (unpinned)
    runs-on: ubuntu-latest
    # Brings the local stack up on the third-party images AS THE COMPOSE FILE
    # NAMES THEM — deliberately unpinned — and reports what those moving tags
    # actually resolved to. Two jobs in one:
    #
    #   1. It is the evidence for pinning. `minio/minio` and `minio/mc` carry no
    #      tag and `postgres:16` moves within its major series, so nobody can
    #      say which versions a green build was green against. This prints the
    #      digests, so a pin names a combination that was observed working
    #      rather than whatever was newest the day someone wrote it down.
    #   2. It runs the tests that cannot run anywhere else. The JobQueue suite
    #      skips without a live Postgres and the store suite fakes fsspec, so
    #      the queue's SQL — FOR UPDATE SKIP LOCKED, the schema, the stale
    #      requeue — is never executed against a real server on any other job.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cloud,ui]"

      - name: Publish the queue port to the runner
        # The compose stack keeps Postgres on its internal network — every
        # consumer is a service beside it, so it needs no host port and a
        # published 5432 would collide with a developer's own Postgres. The
        # test runner here is NOT on that network, so this job adds the
        # mapping and nothing else. It changes no image and no deployment
        # file: the `images` job's rule about having no CI-only variant is
        # about what gets built, and this builds nothing.
        run: |
          cat > /tmp/ci-ports.yml <<'YAML'
          services:
            postgres:
              ports:
                - "5432:5432"
          YAML

      - name: Bring up the bundled backends
        # Only the three third-party services start here — this job is about
        # their images, not this project's. The local override comes along so
        # nothing tries to pull an image of ours that a release has not made.
        run: |
          compose() {
            docker compose -f docker-compose.yml \
                           -f docker-compose.local.override.yml \
                           -f /tmp/ci-ports.yml --profile local "$@"
          }
          compose up -d postgres minio createbuckets
          compose ps
          # Health gates are declared on the services, but `up -d` returns as
          # soon as they are started rather than ready, so wait explicitly.
          for _ in $(seq 1 30); do
            if compose exec -T postgres pg_isready -U womblex; then ready=1; break; fi
            sleep 2
          done
          test "${ready:-0}" = "1" || { compose logs postgres; exit 1; }

      - name: What the moving tags resolved to
        # The whole point of the job. RepoDigests is the registry-wide identity
        # of the bytes that were pulled, which is what a pin would name; the
        # tag alone cannot say, because it moves.
        run: |
          {
            echo "### Resolved third-party images"
            echo
            echo '```'
            for image in postgres:16 minio/minio minio/mc; do
              digest=$(docker image inspect "$image" \
                --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}<not pulled by digest>{{end}}')
              printf '%-16s %s\n' "$image" "$digest"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The suite, against the live backends
        # WOMBLEX_DB_DSN is what un-skips the JobQueue tests — without it they
        # skip silently, which is why the queue's SQL has never run in CI.
        env:
          WOMBLEX_DB_DSN: postgresql://womblex:womblex@localhost:5432/womblex
          WOMBLEX_S3_ENDPOINT: http://localhost:9000
          WOMBLEX_S3_ACCESS_KEY_ID: minioadmin
          WOMBLEX_S3_SECRET_ACCESS_KEY: minioadmin
        run: |
          python -m pytest tests/test_cloud.py -v -rs

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml \
                         -f docker-compose.local.override.yml \
                         -f /tmp/ci-ports.yml --profile local down -v
