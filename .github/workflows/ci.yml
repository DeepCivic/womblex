name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev extras
        # The isaacus SDK is a core dependency now (no [isaacus] extra to ask
        # for), so it's always installed and the enrich/graph/query/embed
        # suites' `importorskip("isaacus")` never skips wholesale. The tests
        # that need a live endpoint still skip on the missing ISAACUS_API_KEY.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cloud,ui]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Fast tests
        run: python -m pytest tests/ -v

  frontend:
    name: Console frontend (ui/)
    runs-on: ubuntu-latest
    # Separate from `test`'s Python matrix (docs/ui-plan.md §6 "CI") — a
    # broken SvelteKit build must fail its own job, not hide inside (or
    # block on) a pipeline test run it has nothing to do with.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint (eslint)
        working-directory: ui
        run: npm run lint

      - name: Type-check (svelte-check)
        working-directory: ui
        run: npm run check

      - name: Build (vite)
        working-directory: ui
        run: npm run build
