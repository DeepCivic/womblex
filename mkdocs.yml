site_name: Womblex
site_description: API reference for the womblex package
repo_url: https://github.com/DeepCivic/womblex
edit_uri: blob/main/

docs_dir: docs
strict: true

# Only the pages in the nav are built; the design and decision documents stay
# in the repository, read on GitHub.
exclude_docs: |
  /*.md
  !/index.md
  !/service-api.md
  !/contract.md
  /accuracy/
  /gen_ref_pages.py

nav:
  - Home: index.md
  - Data contract: contract.md
  - Service API: service-api.md
  - Python API: reference/

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
